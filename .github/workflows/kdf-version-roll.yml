name: Roll KDF Version

on:
  schedule:
    # Run daily at midnight (UTC)
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to check for rolls (dev or main)"
        required: false
        default: ""
        type: string

jobs:
  check-for-updates:
    runs-on: ubuntu-latest
    outputs:
      has_updates: ${{ steps.check-updates.outputs.has_updates }}
      branch: ${{ steps.determine-branch.outputs.branch }}
      current_commit: ${{ steps.current-details.outputs.commit }}
      new_commit: ${{ steps.check-updates.outputs.new_commit }}
      source_urls: ${{ steps.get-source-urls.outputs.source_urls }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Dart SDK
        uses: dart-lang/setup-dart@v1

      - name: Install dependencies
        run: |
          cd packages/komodo_wallet_cli
          dart pub get

      - name: Determine branch from config
        id: determine-branch
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BRANCH: ${{ github.event.inputs.branch }}
        run: |
          BRANCH=$(cat packages/komodo_defi_framework/app_build/build_config.json | jq -r '.api.branch')
          # If workflow dispatch provided a branch, use that instead
          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$INPUT_BRANCH" ]]; then
            BRANCH="$INPUT_BRANCH"
          fi
          echo "Using branch: $BRANCH"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Get source URLs from config
        id: get-source-urls
        run: |
          SOURCE_URLS=$(cat packages/komodo_defi_framework/app_build/build_config.json | jq -c '.api.source_urls')
          echo "source_urls=$SOURCE_URLS" >> $GITHUB_OUTPUT
          echo "Source URLs: $SOURCE_URLS"

      - name: Get current commit details
        id: current-details
        run: |
          COMMIT=$(cat packages/komodo_defi_framework/app_build/build_config.json | jq -r '.api.api_commit_hash')
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT

      - name: Check for new commit
        id: check-updates
        run: |
          BRANCH="${{ steps.determine-branch.outputs.branch }}"
          CURRENT_COMMIT="${{ steps.current-details.outputs.commit }}"
          SOURCE_URLS='${{ steps.get-source-urls.outputs.source_urls }}'

          # KDF lives in the private GLEECBTC/kdf-internal repo, so a branch tip
          # cannot be resolved through the GitHub API without a PAT. The dev-build
          # mirrors publish a per-branch manifest carrying the commit each artefact
          # was built from, which is the thing we actually roll to.
          SAFE_BRANCH="${BRANCH//\//-}"
          NEW_COMMIT=""
          for SOURCE_URL in $(echo "$SOURCE_URLS" | jq -r '.[]'); do
            MANIFEST="${SOURCE_URL%/}/$SAFE_BRANCH/manifest.json"
            echo "Checking manifest: $MANIFEST"
            CANDIDATE=$(curl -sf --max-time 30 "$MANIFEST" | jq -r '.commit // empty')
            if [[ -n "$CANDIDATE" ]]; then
              NEW_COMMIT="$CANDIDATE"
              echo "Resolved $NEW_COMMIT from $SOURCE_URL"
              break
            fi
          done

          # No manifest is published for every branch - `main` has none on any
          # mirror, and that is not expected to change. Fall back to the branch
          # directory listing, which names each artefact `kdf_<short>-<target>.zip`.
          # That yields a SHORT sha only, so it can tell us a *newer build
          # exists* but cannot satisfy `require_full_commit_hash` on its own.
          NEW_SHORT=""
          if [[ -z "$NEW_COMMIT" ]]; then
            for SOURCE_URL in $(echo "$SOURCE_URLS" | jq -r '.[]'); do
              # Ask for newest-first and take the first match, in document
              # order. Do NOT sort the shas: they are hex, so a lexical sort is
              # not chronological (`a1b2c3d` would sort before an older
              # `f3efd2c`). If a mirror ignores the query it falls back to its
              # default ordering, which is name-ascending and may pick the
              # wrong build - that only ever costs a spurious "new build
              # available" note, never an automatic roll, because this path
              # cannot roll at all.
              LISTING="${SOURCE_URL%/}/$SAFE_BRANCH/?sort=time&order=desc"
              echo "No manifest; reading listing: $LISTING"
              CANDIDATE=$(curl -sf --max-time 30 "$LISTING" \
                | grep -oE 'kdf_[0-9a-f]{7,40}-wasm\.zip' \
                | sed -E 's/^kdf_([0-9a-f]+)-wasm\.zip$/\1/' \
                | head -n 1)
              if [[ -n "$CANDIDATE" ]]; then
                NEW_SHORT="$CANDIDATE"
                echo "Resolved short sha $NEW_SHORT from $SOURCE_URL"
                break
              fi
            done
          fi

          if [[ -z "$NEW_COMMIT" && -z "$NEW_SHORT" ]]; then
            # Neither a manifest nor a parseable listing. Not this repo's to
            # fix, and this job is scheduled, so it must not turn the default
            # branch red every midnight - but the pin cannot advance while it
            # lasts, so say so where a human will see it.
            echo "::warning::No mirror published a manifest or a readable listing for branch $BRANCH ($SAFE_BRANCH); the KDF pin cannot advance."
            {
              echo "### KDF roll skipped"
              echo
              echo "Neither \`$SAFE_BRANCH/manifest.json\` nor a readable"
              echo "artefact listing was found, so the branch tip could not be"
              echo "resolved. The pin stays at \`$CURRENT_COMMIT\`."
              echo
              echo "Mirrors checked:"
              for SOURCE_URL in $(echo "$SOURCE_URLS" | jq -r '.[]'); do
                echo "- \`${SOURCE_URL%/}/$SAFE_BRANCH/\`"
              done
            } >> "$GITHUB_STEP_SUMMARY"
            echo "has_updates=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [[ -z "$NEW_COMMIT" ]]; then
            # Listing-only path. Resolving the short sha to the full 40 chars
            # needs the GitHub API against the private GLEECBTC/kdf-internal
            # repo, which `secrets.GITHUB_TOKEN` cannot read - so the automated
            # roll cannot complete here. Detecting the new build is still the
            # useful half of this job: report it and hand over the exact command.
            if [[ "${CURRENT_COMMIT:0:${#NEW_SHORT}}" == "$NEW_SHORT" ]]; then
              echo "Listing short sha $NEW_SHORT matches the pin; nothing to do."
              echo "has_updates=false" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "::warning::A newer KDF build ($NEW_SHORT) is published for $BRANCH, but rolling to it needs a full 40-char sha."
            {
              echo "### New KDF build available: \`$NEW_SHORT\`"
              echo
              echo "Pinned: \`$CURRENT_COMMIT\` — published: \`$NEW_SHORT\`."
              echo
              echo "\`$SAFE_BRANCH\` publishes no \`manifest.json\`, and the full"
              echo "sha cannot be resolved here (the GitHub API for the private"
              echo "\`GLEECBTC/kdf-internal\` repo needs a PAT, not"
              echo "\`secrets.GITHUB_TOKEN\`). Roll it by hand:"
              echo
              echo '```bash'
              echo "dart run packages/komodo_wallet_cli/bin/update_api_config.dart \\"
              echo "  --branch $BRANCH --commit <full-40-char-sha-for-$NEW_SHORT> \\"
              echo "  --source mirror --mirror-url $(echo "$SOURCE_URLS" | jq -r '.[0]') \\"
              echo "  --platform all \\"
              echo "  --config packages/komodo_defi_framework/app_build/build_config.json \\"
              echo "  --output-dir packages/komodo_defi_framework/app_build/temp_downloads \\"
              echo "  --strict --verbose"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "has_updates=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Current commit: $CURRENT_COMMIT"
          echo "Latest commit: $NEW_COMMIT"

          if [[ "$CURRENT_COMMIT" != "$NEW_COMMIT" ]]; then
            echo "New commit found!"
            echo "has_updates=true" >> $GITHUB_OUTPUT
            echo "new_commit=$NEW_COMMIT" >> $GITHUB_OUTPUT
          else
            echo "No updates available."
            echo "has_updates=false" >> $GITHUB_OUTPUT
          fi

  roll-kdf-version:
    needs: check-for-updates
    if: ${{ needs.check-for-updates.outputs.has_updates == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Dart SDK
        uses: dart-lang/setup-dart@v1

      - name: Install dependencies
        run: |
          cd packages/komodo_wallet_cli
          dart pub get

      - name: Create branch for roll
        run: |
          BRANCH="${{ needs.check-for-updates.outputs.branch }}"
          NEW_COMMIT="${{ needs.check-for-updates.outputs.new_commit }}"
          SHORT_COMMIT="${NEW_COMMIT:0:7}"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "GitHub Actions"
          git checkout -b kdf-roll/$BRANCH-$SHORT_COMMIT

      - name: Roll KDF version
        id: roll-version
        run: |
          BRANCH="${{ needs.check-for-updates.outputs.branch }}"
          CURRENT_COMMIT="${{ needs.check-for-updates.outputs.current_commit }}"
          NEW_COMMIT="${{ needs.check-for-updates.outputs.new_commit }}"
          SOURCE_URLS='${{ needs.check-for-updates.outputs.source_urls }}'

          echo "Running update_api_config tool..."
          cd packages/komodo_wallet_cli
          mkdir -p ../komodo_defi_framework/app_build/temp_downloads

          # Try each source URL in order until one succeeds
          SUCCESS=false
          for SOURCE_URL in $(echo $SOURCE_URLS | jq -r '.[]'); do
            echo "Trying source URL: $SOURCE_URL"
            
            # Determine source type from URL
            if [[ "$SOURCE_URL" == *"api.github.com"* ]]; then
              SOURCE_TYPE="github"
            else
              SOURCE_TYPE="mirror"
            fi
            
            echo "Using source type: $SOURCE_TYPE"

            # Pin the exact commit the check job resolved and point the tool at
            # the mirror being tried. Without --commit the tool re-resolves the
            # branch tip on its own, so a tip that moved between the two jobs -
            # or mirrors publishing different tips - could pin a different
            # commit than the one this branch and PR are named for. Without
            # --mirror-url every iteration of this loop would query the tool's
            # default mirror rather than $SOURCE_URL.
            if dart bin/update_api_config.dart \
              --branch "$BRANCH" \
              --source "$SOURCE_TYPE" \
              --commit "$NEW_COMMIT" \
              --mirror-url "$SOURCE_URL" \
              --config ../komodo_defi_framework/app_build/build_config.json \
              --output-dir ../komodo_defi_framework/app_build/temp_downloads \
              --verbose; then
              
              echo "Successfully rolled using $SOURCE_URL"
              SUCCESS=true
              break
            else
              echo "Failed to roll using $SOURCE_URL, trying next source..."
            fi
          done

          if [ "$SUCCESS" = false ]; then
            echo "All sources failed. Exiting with error."
            exit 1
          fi

      - name: Commit changes
        run: |
          BRANCH="${{ needs.check-for-updates.outputs.branch }}"
          NEW_COMMIT="${{ needs.check-for-updates.outputs.new_commit }}"
          SHORT_COMMIT="${NEW_COMMIT:0:7}"

          # Check if there are changes to commit
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git add packages/komodo_defi_framework/app_build/build_config.json
          git commit -m "chore: roll KDF version to commit $SHORT_COMMIT for branch $BRANCH"
          git push origin kdf-roll/$BRANCH-$SHORT_COMMIT

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ needs.check-for-updates.outputs.branch }}"
          NEW_COMMIT="${{ needs.check-for-updates.outputs.new_commit }}"
          SHORT_COMMIT="${NEW_COMMIT:0:7}"

          PR_TITLE="chore: roll KDF version to commit $SHORT_COMMIT for branch $BRANCH"
          PR_BODY="This PR rolls the KDF version to the latest commit ($SHORT_COMMIT) for the '$BRANCH' branch.

          **Changes:**
          - Rolled KDF version from \`${{ needs.check-for-updates.outputs.current_commit }}\` to \`$NEW_COMMIT\`

          This PR was automatically generated by GitHub Actions."

          gh pr create \
            --title "$PR_TITLE" \
            --body "$PR_BODY" \
            --base "$BRANCH" \
            --head "kdf-roll/$BRANCH-$SHORT_COMMIT"
