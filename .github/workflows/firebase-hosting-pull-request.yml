name: Deploy Playground to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  setup:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned, not floating. `channel: stable` alone takes whatever Flutter
      # stable is that day, so a Flutter release breaks the build on a branch
      # nobody touched -- which is what happened on 2026-08-24 (3.44.8 -> 3.47.1).
      # The local setup action reads the SDK's .fvmrc pin.
      - uses: ./.github/actions/setup-flutter
      # Disabled melos generation due to circular dependency issues caused by komodo_defi_rpc_methods
      # and komodo_defi_types packages. This will be revisited in the future.
      # The app should already have the necessary generated files committed to the repository. If
      # this is not the case, we have bigger issues.
      # - name: Install Melos
      #   run: dart pub global activate melos
      # - name: Bootstrap workspace
      #   run: melos bootstrap
      # - name: Cache dependencies
      #   uses: actions/cache@v3
      #   with:
      #     path: |
      #       ~/.pub-cache
      #       **/.flutter-plugins
      #       **/.flutter-plugins-dependencies
      #     key: ${{ runner.os }}-pub-${{ hashFiles('.fvmrc', '**/pubspec.yaml', '**/pubspec.lock') }}
      #     restore-keys: |
      #       ${{ runner.os }}-pub-

  build_and_preview_playground_preview:
    needs: setup
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
      # See Melos comment above
      # - name: Install Melos
      #   run: dart pub global activate melos
      # - name: Bootstrap workspace
      #   run: melos bootstrap
      - name: Install locked workspace dependencies
        run: flutter pub get --enforce-lockfile
      - name: Run dry web build to generate assets (expected to fail)
        env:
          GITHUB_API_PUBLIC_READONLY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cd playground && flutter build web --release --no-pub || echo "Dry build completed (failure expected)"
      - name: Test playground JSON editor compatibility
        env:
          GITHUB_API_PUBLIC_READONLY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: playground
        run: flutter test --no-pub test/json_editor_compatibility_test.dart
      - name: Build playground web
        env:
          GITHUB_API_PUBLIC_READONLY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cd playground && flutter build web --release --no-pub
      - uses: ./.github/actions/firebase-hosting-deploy
        with:
          channelId: pull-${{ github.event.pull_request.number }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KOMODO_PLAYGROUND }}
          projectId: komodo-playground
          entryPoint: ./playground
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks

  build_and_preview_sdk_example_preview:
    needs: setup
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
      # See Melos comment above
      # - name: Install Melos
      #   run: dart pub global activate melos
      # - name: Bootstrap workspace
      #   run: melos bootstrap
      - name: Install locked workspace dependencies
        run: flutter pub get --enforce-lockfile
      - name: Run dry web build to generate assets (expected to fail)
        env:
          GITHUB_API_PUBLIC_READONLY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cd packages/komodo_defi_sdk/example && flutter build web --release --no-pub || echo "Dry build completed (failure expected)"
      - name: Build SDK example web
        env:
          GITHUB_API_PUBLIC_READONLY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cd packages/komodo_defi_sdk/example && flutter build web --release --no-pub
      - uses: ./.github/actions/firebase-hosting-deploy
        with:
          channelId: pull-${{ github.event.pull_request.number }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KOMODO_DEFI_SDK }}
          projectId: komodo-defi-sdk
          entryPoint: ./packages/komodo_defi_sdk/example
          target: kdf-sdk
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
