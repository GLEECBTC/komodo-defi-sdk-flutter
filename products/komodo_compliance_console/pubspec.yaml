name: komodo_compliance_console
description: Tools for external parties to view/manage ecosystem compliance
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.14.0 <4.0.0"
  flutter: ">=3.50.0 <4.0.0"

resolution: workspace

dependencies:
  bloc: ^9.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  very_good_analysis: ^9.0.0

flutter:
  uses-material-design: true
  generate: true
